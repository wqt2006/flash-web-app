name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1
          pip install -r requirements.txt
          pytest test_app.py
        continue-on-error: false

      - name: Deploy to Touge Server via SSH (Port 44884)
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TOUGE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -p 44884 root@${TOUGE_SERVER_IP%%:*} << 'EOF'
            cd /root/flash-web-app || (echo "项目目录不存在"; exit 1;)
            git pull origin main || (echo "git拉取失败"; exit 1;)
            pip3 install -r requirements.txt || (echo "依赖安装失败"; exit 1;)
            supervisorctl restart flask-web-app || (echo "应用重启失败"; exit 1;)
            echo "部署完成"
          EOF
